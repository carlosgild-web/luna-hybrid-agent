# The agent evaluation suite (PLAN_HYBRID.md section 5, decision 0040).
#
# 30 questions about the demo company, in five tiers:
#   doc       answered by the documents only: search_documents, no database tool
#   db        answered by the business database only: no document search
#   external  needs fx_rate (with ALLOW_EXTERNAL_APIS off it answers with the stored rate)
#   hybrid    needs the documents and the database
#   refusal   Luna must refuse or say the data isn't there, without inventing numbers
#
# Each case may say:
#   tools     tools that must be called; an entry that is a list means "one of these"
#   forbid    tools that must not be called
#   facts     groups of alternatives; the answer must contain one of each group
#             (case, accents and dashes don't matter)
#   numbers   values the answer must state, at any precision it chooses: 519725.51 is
#             stated by "519,725.51", "519.725,51" or "519,726"; 59.8 by "60%"
#   sources   documents the answer must cite, and the only ones it may cite
#   refuse    true: the answer must refuse or say the data isn't available
#   chart     true: make_chart must draw a chart whose values all come from tool results
#   fake      a perfect run, for the scripted model CI uses (`agent-eval --fake`):
#             [tool, {arguments}] is a tool call, a string is the answer, in which
#             {cite:<file>} becomes the number of the first passage shown from <file>
#
# The values come from the seeded business database (`seed-business-db`, the same
# every time) and the demo documents (`seed-demo`); the CI run checks every one of
# them against the real tools.

today: 2026-11-16

cases:
  # ------------------------------------------------------------------ doc
